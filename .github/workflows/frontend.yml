name: frontend

on:
  workflow_call:
    inputs:
      isFrontend:
        required: true
        type: string

jobs:
  frontend:
    if: ${{ inputs.isFrontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend lint
      # Before the build: `next build` type-checks the app but skips the test files.
      - run: pnpm --filter frontend typecheck
      # Built only to prove it compiles, so placeholder config is enough. Vercel
      # builds the deployed bundle with the real values.
      - run: pnpm --filter frontend build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: volvo-calc-charger
      - run: pnpm --filter frontend test
