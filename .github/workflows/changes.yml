name: changes

on:
  workflow_call:
    outputs:
      frontend:
        value: ${{ jobs.changes.outputs.frontend }}
      backend:
        value: ${{ jobs.changes.outputs.backend }}
      shared:
        value: ${{ jobs.changes.outputs.shared }}
      rules:
        value: ${{ jobs.changes.outputs.rules }}
      e2e:
        value: ${{ jobs.changes.outputs.e2e }}
      typecheck:
        value: ${{ jobs.changes.outputs.typecheck }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      shared: ${{ steps.filter.outputs.shared }}
      rules: ${{ steps.filter.outputs.rules }}
      e2e: ${{ steps.filter.outputs.e2e }}
      typecheck: ${{ steps.filter.outputs.typecheck }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'shared/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/**'
            backend:
              - 'backend/**'
              - 'shared/**'
              - 'firebase.json'
              - 'scripts/emulators.sh'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/**'
            shared:
              - 'shared/**'
              - 'vitest.config.ts'
              - 'vitest.setup.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/**'
            rules:
              - 'firestore.rules'
              - 'firestore.indexes.json'
              - 'rules/**'
              - 'firebase.json'
              - 'scripts/emulators.sh'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/**'
            typecheck:
              - 'shared/**'
              - 'e2e/**'
              - 'rules/**'
              - 'tsconfig.json'
              - 'playwright.config.ts'
              - 'vitest.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/**'
            # The only job that runs the whole stack together, so any half moving counts.
            e2e:
              - 'frontend/**'
              - 'backend/**'
              - 'shared/**'
              - 'firestore.rules'
              - 'firebase.json'
              - 'e2e/**'
              - 'scripts/**'
              - 'playwright.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/**'
