name: backend

on:
  workflow_call:
    inputs:
      isBackend:
        required: true
        type: string

jobs:
  backend:
    if: ${{ inputs.isBackend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The Firebase emulators are a Java process and firebase-tools requires 21+.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-firebase-emulators-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter backend lint
      # Covers `backend/scripts` too, which the build leaves out.
      - run: pnpm --filter backend typecheck
      - run: pnpm --filter backend build
      - run: pnpm test:backend
